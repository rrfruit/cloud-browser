version: '3.8'
services:
  playwright-app:
    build:
      context: .
    container_name: playwright-jlesage
    environment:
      - DISPLAY_WIDTH=1366
      - DISPLAY_HEIGHT=768
      - ENABLE_CJK_FONT=1
      - VNC_PASSWORD=password
    #   USER_ID: "0"
    #   GROUP_ID: "0"
    ports:
      - "5801:5801"
      - "5800:5800"
    volumes:
      - playwright-data:/data
    shm_size: "2gb"

volumes:
  playwright-data: